# Xbox CDN 节点与域名列表
#
# 格式：
#   分组名 IP地址               - 参与测速的 CDN IP
#   DOMAIN 分组名 域名          - 该域名解析到这一组测速最快的 IP
#
# 贡献方式：在已有分组下补充 IP，或新增分组及对应域名。
# 查询国内 CDN IP：nslookup <域名> 223.5.5.5
#
# 关于 .com 与 .cn：
#   国内 DNS 返回国内 IP 时，Xbox 使用 .cn 域名；
#   否则可能回退到 .com 域名。
#   只有确认 .com 域名能解析到国内 CDN 节点时，才加到这里。

# ---------------------------------------------------------------------------
# Xbox 国内 CDN（xboxlive.cn 资源）
# 用途：游戏资源、补丁、商店内容
# ---------------------------------------------------------------------------
XBOX_CN 117.89.179.132
XBOX_CN 211.95.70.106
XBOX_CN 101.227.95.78
XBOX_CN 61.170.68.69
XBOX_CN 117.25.156.10

DOMAIN XBOX_CN assets1.xboxlive.cn
DOMAIN XBOX_CN assets2.xboxlive.cn
DOMAIN XBOX_CN d1.xboxlive.cn
DOMAIN XBOX_CN d2.xboxlive.cn

# ---------------------------------------------------------------------------
# Xbox 国内 CDN - dlassets（游戏本体等大文件下载）
# ---------------------------------------------------------------------------
XBOX_CN_DL 61.170.68.69
XBOX_CN_DL 101.227.95.78

DOMAIN XBOX_CN_DL dlassets.xboxlive.cn
DOMAIN XBOX_CN_DL dlassets2.xboxlive.cn
DOMAIN XBOX_CN_DL dlassets-ssl.xboxlive.com

# ---------------------------------------------------------------------------
# Akamai CDN（xboxlive.com 全球节点，可能有国内节点）
# 先用以下命令确认解析到国内节点，再取消 DOMAIN 行的注释：
#   nslookup assets1.xboxlive.com 223.5.5.5
# ---------------------------------------------------------------------------
AKAMAI_CN 2.20.69.24
AKAMAI_CN 2.17.198.115
AKAMAI_CN 23.50.230.24
AKAMAI_CN 184.25.56.89

# DOMAIN AKAMAI_CN assets1.xboxlive.com
# DOMAIN AKAMAI_CN assets2.xboxlive.com
# DOMAIN AKAMAI_CN dlassets.xboxlive.com


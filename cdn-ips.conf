# Xbox CDN IP and Domain List
# Format:
#   GROUP_NAME IP_ADDRESS       - CDN IP to test
#   DOMAIN GROUP_NAME domain    - domain to point at GROUP_NAME's best IP
#
# To contribute: add IPs under existing groups, or add new groups + their domains.
# Find IPs via: nslookup <domain> 223.5.5.5
#
# NOTE on .com vs .cn:
#   Xbox uses .cn domains in China when DNS returns a CN IP.
#   If your DNS returns a foreign IP, Xbox may fall back to .com domains.
#   Only add .com domains here if you confirm they resolve to CN CDN IPs.

# ---------------------------------------------------------------------------
# Xbox China CDN (xboxlive.cn assets)
# Used for: game assets, patches, store content
# ---------------------------------------------------------------------------
XBOX_CN 117.89.179.132
XBOX_CN 211.95.70.106
XBOX_CN 101.227.95.78
XBOX_CN 61.170.68.69
XBOX_CN 117.25.156.10

DOMAIN XBOX_CN assets1.xboxlive.cn
DOMAIN XBOX_CN assets2.xboxlive.cn
DOMAIN XBOX_CN d1.xboxlive.cn
DOMAIN XBOX_CN d2.xboxlive.cn

# ---------------------------------------------------------------------------
# Xbox China CDN - dlassets (game downloads, large files)
# ---------------------------------------------------------------------------
XBOX_CN_DL 61.170.68.69
XBOX_CN_DL 101.227.95.78

DOMAIN XBOX_CN_DL dlassets.xboxlive.cn
DOMAIN XBOX_CN_DL dlassets2.xboxlive.cn
DOMAIN XBOX_CN_DL dlassets-ssl.xboxlive.com

